name: test

# cypkg's test layers (tests/run.sh) on a stock native ari, its browser build in headless Chrome,
# and a daily contract check against cvcpkg.org. tests/run.sh includes the integration layer
# (tests/integration.sh): cypkg against a local cvcpkg-server, installed from cy-pca/cvcpkg.
#
# The test job runs the ari package from cvcpkg.org, as a person installs it: cypkg targets a
# stock, packaged ari. It needs json-parse (transfix/libcvc#883), `ari test` and functions: (#896,
# #900), the ws-* verbs (#923) and sha256-hex/random-token (#911); ari 3.7.6 is the first release
# with them all, and "Check the ari" stops an older one.
#
# No cvcpkg package ships ari's single-threaded wasm page yet (arigl-web will), so the browser job
# builds it from libcvc at the same release tag (LIBCVC_REF), with any open PRs in LIBCVC_PRS and
# LIBCVC_WEB_PRS merged on top by tools/libcvc.sh (none today). Move LIBCVC_REF to each new
# release, and install the page from cvcpkg once a package has it.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      libcvc_ref:
        description: libcvc tag, branch or commit to build the browser job's ari page from
        default: v3.7.6
      libcvc_prs:
        description: libcvc PR numbers to merge on top, space-separated
        default: ""
      libcvc_web_prs:
        description: more libcvc PRs for the browser build
        default: ""

env:
  LIBCVC_REF: ${{ inputs.libcvc_ref || 'v3.7.6' }}
  LIBCVC_PRS: ${{ inputs.libcvc_prs || '' }}
  LIBCVC_WEB_PRS: ${{ inputs.libcvc_web_prs || '' }}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The name is the required check main-protect (ruleset 26235456) lists; keep it until the
    # ruleset changes with it.
    name: tests/run.sh (ari ${{ inputs.libcvc_ref || 'master' }} + PRs)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # ari is the cvcpkg package, as a person installs it (`cvcpkg install ari`): its runtime
      # closure is libcvc and the terminal backends, and its RPATH finds them in the prefix.
      - name: Install cvcpkg and ari (cvcpkg)
        run: |
          set -euo pipefail
          curl -fsSL https://cvcpkg.org/install.sh | sh
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          prefix="$RUNNER_TEMP/ari"
          cvcpkg install ari --prefix "$prefix" --config release --link shared \
            --no-fallback-to-source
          echo "ARI_PREFIX=$prefix" >>"$GITHUB_ENV"

      - name: Check the ari
        run: |
          set -euo pipefail
          ari="$ARI_PREFIX/bin/ari"
          echo "ARI=$ari" >>"$GITHUB_ENV"
          "$ari" info | grep -E 'terminal backend|desktop backend|HTTP'
          # Read whole outputs first: grep -q stops at the first match, and under pipefail the
          # writer's SIGPIPE would fail the step.
          fns=$("$ari" info --functions | tr ' ,' '\n\n')
          grep -qx json-parse <<<"$fns" \
            || { echo "::error::this ari has no json-parse (transfix/libcvc#883)"; exit 1; }
          help=$("$ari" --help 2>&1 || true)
          grep -q 'ari test' <<<"$help" \
            || { echo "::error::this ari has no 'ari test' (transfix/libcvc#896)"; exit 1; }
          printf 'meta: {name: f, min_libcvc: 3.7.4}\nfunctions: (defun f () 1)\ntests: {f: (assert (= (f) 1))}\n' >"$RUNNER_TEMP/f.ari"
          "$ari" test "$RUNNER_TEMP/f.ari" >/dev/null \
            || { echo "::error::this ari has no functions: (transfix/libcvc#900)"; exit 1; }

      # tmux drives the interactive layer. cvcpkg packages it for arm64 only so far, so x86_64
      # runners fall back to apt.
      - name: Install tmux
        run: |
          if ! cvcpkg install tmux --prefix "$RUNNER_TEMP/tmux" --config release --link shared 2>/dev/null; then
            sudo apt-get install -y --no-install-recommends tmux
          else
            echo "$RUNNER_TEMP/tmux/bin" >>"$GITHUB_PATH"
          fi
          tmux -V

      # Layer 3d installs cvcpkg-server into CVCPKG_VENV, and fails here rather than skipping when
      # it can't.
      - name: tests/run.sh
        env:
          TERM: xterm-256color
          CVCPKG_VENV: ${{ runner.temp }}/cvcpkg-venv
          CVCPKG_REQUIRED: "1"
        run: tests/run.sh

  browser:
    name: browser build in headless Chrome
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check out libcvc and merge the PRs the browser build needs
        id: libcvc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # the PR lists are words
          tools/libcvc.sh _libcvc "$LIBCVC_REF" $LIBCVC_PRS $LIBCVC_WEB_PRS | tee libcvc.log
          tail -1 libcvc.log >>"$GITHUB_OUTPUT"

      # ari's wasm page (ari.html, ari.js, ari.wasm, ari-web.*, xterm/), keyed by its source tree.
      - name: Restore a built ari page
        id: page-cache
        uses: actions/cache/restore@v4
        with:
          path: _libcvc/build-wasm/bin
          key: ari-wasm-${{ steps.libcvc.outputs.tree }}

      # As libcvc's ari-wasm job does: cvcpkg, then its emsdk and the wasm deps ari needs.
      - name: Install cvcpkg, the build tools, emsdk and the wasm deps
        if: steps.page-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://cvcpkg.org/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          cvcpkg install cmake ninja --prefix "$RUNNER_TEMP/tools" --config release --link shared
          echo "$RUNNER_TEMP/tools/bin" >>"$GITHUB_PATH"
          cvcpkg install emsdk --platform linux --prefix "$RUNNER_TEMP/emsdk" \
            --config release --link shared --no-fallback-to-source
          test -f "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          deps="$RUNNER_TEMP/wasm-deps"
          for p in zlib bzip2 xz zstd boost pegtl yaml-cpp ftxui; do
            cvcpkg install "$p" --prefix "$deps" --platform wasm --arch wasm32 \
              --config release --link static --no-fallback-to-source
          done
          echo "WASM_DEPS=$deps" >>"$GITHUB_ENV"

      - name: Build ari's page (wasm, single-threaded)
        if: steps.page-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -G Ninja -S _libcvc -B _libcvc/build-wasm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_FIND_ROOT_PATH="$WASM_DEPS" -DCMAKE_PREFIX_PATH="$WASM_DEPS" \
            -DCVC_BUILD_ARI=ON -DCVC_ARI_WASM_DEFAULT_SRC=main.ari \
            -DCVC_BUILD_ARIGL=OFF -DCVC_BUILD_ARISRV=OFF -DCVC_BUILD_CVCGL=OFF \
            -DCVC_BUILD_EXAMPLES=OFF -DCVC_BUILD_TESTS=OFF -DCVC_BUILD_CLI=OFF \
            -DCVC_ENABLE_CUDA=OFF -DCVC_ENABLE_OPENMP=OFF -DDISABLE_CGAL=ON \
            -DCVC_USING_HDF5=OFF -DCVC_USING_IMOD_MRC=OFF -DCVC_ENABLE_IMAGEMAGICK=OFF \
            -DCVC_ENABLE_FFTW=OFF -DCVC_FFT_PROVIDER=none -DCVC_ENABLE_ASSIMP=OFF \
            -DCVC_ENABLE_MESHER=OFF -DCVC_ENABLE_SDF=OFF -DCVC_ENABLE_LIBIGL=OFF \
            -DCVC_WITH_JOLT=OFF -DCVC_WASM_PTHREADS=OFF \
            | tee configure.log
          for want in "Ariadne: .ari YAML loader ENABLED" "Ariadne: FTXUI terminal backend ENABLED"; do
            grep -qF "$want" configure.log || { echo "::error::configure did not print '$want'"; exit 1; }
          done
          ninja -C _libcvc/build-wasm ari
          ls -la _libcvc/build-wasm/bin

      - name: Save the built ari page
        if: steps.page-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _libcvc/build-wasm/bin
          key: ${{ steps.page-cache.outputs.cache-primary-key }}

      - name: Assemble the site
        run: |
          tools/site.sh _libcvc/build-wasm/bin site
          du -sh site/apps/cypkg site/apps/cypkg/ari.wasm

      # Node 22 for its built-in WebSocket; the runner image has Chrome.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: tests/browser.mjs
        run: node tests/browser.mjs --site site --chrome "$(command -v google-chrome)" --shots shots

      - name: Upload the failed steps' screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-shots
          path: shots
          if-no-files-found: ignore

      # GitHub Pages: the same page with web/ariadne.config.pages.json, which browses
      # https://cvcpkg.org. Only main's tested build is published (the pages job deploys it).
      - name: Assemble the GitHub Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: tools/site.sh _libcvc/build-wasm/bin pages web/ariadne.config.pages.json

      - name: Upload the GitHub Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/apps/cypkg

  pages:
    name: deploy to GitHub Pages
    needs: browser
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  contract:
    name: contract with cvcpkg.org
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I tests/contract.py

  recipe:
    name: package with the recipe
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install cvcpkg
        run: |
          curl -fsSL https://cvcpkg.org/install.sh | sh
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      - name: cvcpkg build cypkg
        run: |
          set -euo pipefail
          cvcpkg build cypkg --local --platform any --prefix "$RUNNER_TEMP/prefix"
          cd "$RUNNER_TEMP/prefix"
          for f in bin/cypkg bin/cypkg.cmd share/cypkg/main.ari share/cypkg/search.ari \
                   share/cypkg/package.ari share/cypkg/lib.ari share/cypkg/views.ari \
                   share/doc/cypkg/LICENSE; do
            test -f "$f" || { echo "::error::the package has no $f"; exit 1; }
          done
          bin/cypkg --help
