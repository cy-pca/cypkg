name: test

# cypkg's test layers (tests/run.sh) on a stock native ari, its browser build in headless Chrome,
# and a daily contract check against cvcpkg.org.
#
# ari comes from source: no ari package yet has what cypkg needs. tools/libcvc.sh merges these
# open transfix/libcvc PRs onto master, in order, skipping any that have merged:
#   #883  json-parse, state-set-tree
#   #896  quit codes, assert, `ari test`
#   #900  functions: (stacked on #896)
#   #902  a bound widget's on: runs after its write (a combo's on:)
#   #904  a load:ed module's on_tick: runs (stacked on #900)
#   #905  a link: hole grants the subtree under its target
#   #887  the browser pages: ari.html runs a document by URL (browser job only; it conflicts
#         with #896 in src/ari/main.cpp, which tools/libcvc-resolve.py resolves)
# Empty a list once its PRs have merged; once an ari package (and its web page) has them, install
# those from cvcpkg instead of building.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      libcvc_ref:
        description: libcvc branch or commit to build ari from
        default: master
      libcvc_prs:
        description: libcvc PR numbers to merge on top, space-separated
        default: "883 896 900 902 904 905"
      libcvc_web_prs:
        description: more libcvc PRs for the browser build
        default: "887"

env:
  LIBCVC_REF: ${{ inputs.libcvc_ref || 'master' }}
  LIBCVC_PRS: ${{ inputs.libcvc_prs || '883 896 900 902 904 905' }}
  LIBCVC_WEB_PRS: ${{ inputs.libcvc_web_prs || '887' }}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests/run.sh (ari ${{ inputs.libcvc_ref || 'master' }} + PRs)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Check out libcvc and merge the PRs cypkg needs
        id: libcvc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # the PR list is words
          tools/libcvc.sh _libcvc "$LIBCVC_REF" $LIBCVC_PRS | tee libcvc.log
          tail -1 libcvc.log >>"$GITHUB_OUTPUT"

      # The built ari, keyed by the source tree it came from, so an unchanged libcvc isn't rebuilt.
      # It's saved right after the build, so a failing test doesn't throw the build away.
      - name: Restore a built ari
        id: ari-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            _libcvc/build/bin/ari
            _libcvc/build/lib/libcvc.so*
          key: ari-${{ runner.os }}-${{ runner.arch }}-${{ steps.libcvc.outputs.tree }}

      # libcvc's dependencies come from cvcpkg, as libcvc's own CI gets them: the closure its
      # in-tree recipe declares. The action is pinned to the commit libcvc's CI pins.
      - name: Install libcvc's dependencies (cvcpkg)
        id: deps
        uses: transfix/libcvc-deps/.github/actions/cvcpkg-install@c5091347c596fcf09c697bc74c585370fce08ad9
        with:
          repository: cy-pca/cvcpkg
          libcvc_deps_ref: master
          recipe: _libcvc/cvcpkg/recipes/libcvc
          build_type: Release
          link: shared

      - name: Install the terminal backends and the build tools (cvcpkg)
        run: |
          set -euo pipefail
          deps="${{ steps.deps.outputs.path }}"
          [ -n "$deps" ] || { echo "::error::cvcpkg could not install libcvc's dependencies"; exit 1; }
          echo "DEPS=$deps" >>"$GITHUB_ENV"
          # ari needs the Ariadne libraries: yaml-cpp (the loader), ftxui and tvision (the
          # terminal backends). libcvc's CI installs them the same way.
          cvcpkg install yaml-cpp nlohmann-json json-schema-validator ftxui tvision \
            --prefix "$deps" --config release --link shared
          tools="$RUNNER_TEMP/tools"
          cvcpkg install cmake ninja --prefix "$tools" --config release --link shared
          echo "$tools/bin" >>"$GITHUB_PATH"

      - name: Build ari
        if: steps.ari-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cmake -S _libcvc -B _libcvc/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$DEPS" \
            -DCVC_BUILD_ARI=ON -DCVC_ARIADNE_TVISION=ON \
            -DCVC_BUILD_ARIGL=OFF -DCVC_BUILD_ARISRV=OFF -DCVC_BUILD_CLI=OFF \
            -DCVC_BUILD_CVCGL=OFF -DCVC_BUILD_EXAMPLES=OFF -DCVC_BUILD_TESTS=OFF \
            -DCVC_BUILD_PYCVC=OFF -DCVC_BUILD_LSYS_TOOLS=OFF \
            -DCVC_ENABLE_CUDA=OFF -DCVC_ENABLE_LIBIGL=OFF -DCVC_ENABLE_ASSIMP=OFF \
            -DCVC_ENABLE_IMAGEMAGICK=OFF -DCVC_WITH_JOLT=OFF \
            | tee configure.log
          for want in "Ariadne: FTXUI terminal backend ENABLED" "Ariadne: tvision terminal backend ENABLED"; do
            grep -qF "$want" configure.log || { echo "::error::configure did not print '$want'"; exit 1; }
          done
          ninja -C _libcvc/build ari

      - name: Save the built ari
        if: steps.ari-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            _libcvc/build/bin/ari
            _libcvc/build/lib/libcvc.so*
          key: ${{ steps.ari-cache.outputs.cache-primary-key }}

      - name: Check the ari
        run: |
          set -euo pipefail
          ari="$GITHUB_WORKSPACE/_libcvc/build/bin/ari"
          echo "ARI=$ari" >>"$GITHUB_ENV"
          "$ari" info | grep -E 'terminal backend|desktop backend|HTTP'
          "$ari" info --functions | tr ' ,' '\n\n' | grep -qx json-parse \
            || { echo "::error::this ari has no json-parse (transfix/libcvc#883)"; exit 1; }
          "$ari" --help 2>&1 | grep -q 'ari test' \
            || { echo "::error::this ari has no 'ari test' (transfix/libcvc#896)"; exit 1; }
          printf 'meta: {name: f, min_libcvc: 3.7.4}\nfunctions: (defun f () 1)\ntests: {f: (assert (= (f) 1))}\n' >"$RUNNER_TEMP/f.ari"
          "$ari" test "$RUNNER_TEMP/f.ari" >/dev/null \
            || { echo "::error::this ari has no functions: (transfix/libcvc#900)"; exit 1; }

      # tmux drives the interactive layer. cvcpkg packages it for arm64 only so far, so x86_64
      # runners fall back to apt.
      - name: Install tmux
        run: |
          if ! cvcpkg install tmux --prefix "$RUNNER_TEMP/tmux" --config release --link shared 2>/dev/null; then
            sudo apt-get install -y --no-install-recommends tmux
          else
            echo "$RUNNER_TEMP/tmux/bin" >>"$GITHUB_PATH"
          fi
          tmux -V

      - name: tests/run.sh
        env:
          TERM: xterm-256color
        run: tests/run.sh

  browser:
    name: browser build in headless Chrome
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check out libcvc and merge the PRs the browser build needs
        id: libcvc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # the PR lists are words
          tools/libcvc.sh _libcvc "$LIBCVC_REF" $LIBCVC_PRS $LIBCVC_WEB_PRS | tee libcvc.log
          tail -1 libcvc.log >>"$GITHUB_OUTPUT"

      # ari's wasm page (ari.html, ari.js, ari.wasm, ari-web.*, xterm/), keyed by its source tree.
      - name: Restore a built ari page
        id: page-cache
        uses: actions/cache/restore@v4
        with:
          path: _libcvc/build-wasm/bin
          key: ari-wasm-${{ steps.libcvc.outputs.tree }}

      # As libcvc's ari-wasm job does: cvcpkg, then its emsdk and the wasm deps ari needs.
      - name: Install cvcpkg, the build tools, emsdk and the wasm deps
        if: steps.page-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://cvcpkg.org/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          cvcpkg install cmake ninja --prefix "$RUNNER_TEMP/tools" --config release --link shared
          echo "$RUNNER_TEMP/tools/bin" >>"$GITHUB_PATH"
          cvcpkg install emsdk --platform linux --prefix "$RUNNER_TEMP/emsdk" \
            --config release --link shared --no-fallback-to-source
          test -f "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          deps="$RUNNER_TEMP/wasm-deps"
          for p in zlib bzip2 xz zstd boost pegtl yaml-cpp ftxui; do
            cvcpkg install "$p" --prefix "$deps" --platform wasm --arch wasm32 \
              --config release --link static --no-fallback-to-source
          done
          echo "WASM_DEPS=$deps" >>"$GITHUB_ENV"

      - name: Build ari's page (wasm, single-threaded)
        if: steps.page-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -G Ninja -S _libcvc -B _libcvc/build-wasm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_FIND_ROOT_PATH="$WASM_DEPS" -DCMAKE_PREFIX_PATH="$WASM_DEPS" \
            -DCVC_BUILD_ARI=ON -DCVC_ARI_WASM_DEFAULT_SRC=main.ari \
            -DCVC_BUILD_ARIGL=OFF -DCVC_BUILD_ARISRV=OFF -DCVC_BUILD_CVCGL=OFF \
            -DCVC_BUILD_EXAMPLES=OFF -DCVC_BUILD_TESTS=OFF -DCVC_BUILD_CLI=OFF \
            -DCVC_ENABLE_CUDA=OFF -DCVC_ENABLE_OPENMP=OFF -DDISABLE_CGAL=ON \
            -DCVC_USING_HDF5=OFF -DCVC_USING_IMOD_MRC=OFF -DCVC_ENABLE_IMAGEMAGICK=OFF \
            -DCVC_ENABLE_FFTW=OFF -DCVC_FFT_PROVIDER=none -DCVC_ENABLE_ASSIMP=OFF \
            -DCVC_ENABLE_MESHER=OFF -DCVC_ENABLE_SDF=OFF -DCVC_ENABLE_LIBIGL=OFF \
            -DCVC_WITH_JOLT=OFF -DCVC_WASM_PTHREADS=OFF \
            | tee configure.log
          for want in "Ariadne: .ari YAML loader ENABLED" "Ariadne: FTXUI terminal backend ENABLED"; do
            grep -qF "$want" configure.log || { echo "::error::configure did not print '$want'"; exit 1; }
          done
          ninja -C _libcvc/build-wasm ari
          ls -la _libcvc/build-wasm/bin

      - name: Save the built ari page
        if: steps.page-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _libcvc/build-wasm/bin
          key: ${{ steps.page-cache.outputs.cache-primary-key }}

      - name: Assemble the site
        run: |
          tools/site.sh _libcvc/build-wasm/bin site
          du -sh site/apps/cypkg site/apps/cypkg/ari.wasm

      # Node 22 for its built-in WebSocket; the runner image has Chrome.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: tests/browser.mjs
        run: node tests/browser.mjs --site site --chrome "$(command -v google-chrome)" --shots shots

      - name: Upload the failed steps' screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-shots
          path: shots
          if-no-files-found: ignore

  contract:
    name: contract with cvcpkg.org
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I tests/contract.py
