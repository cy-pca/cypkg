name: test

# cypkg's test layers (tests/run.sh) on a stock native ari, its browser build in headless Chrome,
# and a daily contract check against cvcpkg.org. tests/run.sh includes the integration layer
# (tests/integration.sh): cypkg against a local cvcpkg-server, installed from cy-pca/cvcpkg.
#
# The test job runs the ari package from cvcpkg.org, as a person installs it: cypkg targets a
# stock, packaged ari. It needs json-parse (transfix/libcvc#883), `ari test` and functions: (#896,
# #900), the ws-* verbs (#923) and sha256-hex/random-token (#911); ari 3.7.6 is the first release
# with them all, and "Check the ari" stops an older one.
#
# The browser job serves ari's single-threaded wasm page from the arigl-web package (3.7.8 is the
# first release with it), as a site installs it: cvcpkg.org's page, not one built here.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The name is the required check main-protect (ruleset 26235456) lists, from when this job
    # built ari from libcvc master; keep it until the ruleset changes with it.
    name: tests/run.sh (ari master + PRs)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # ari is the cvcpkg package, as a person installs it (`cvcpkg install ari`): its runtime
      # closure is libcvc and the terminal backends, and its RPATH finds them in the prefix.
      - name: Install cvcpkg and ari (cvcpkg)
        run: |
          set -euo pipefail
          curl -fsSL https://cvcpkg.org/install.sh | sh
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          prefix="$RUNNER_TEMP/ari"
          cvcpkg install ari --prefix "$prefix" --config release --link shared \
            --no-fallback-to-source
          echo "ARI_PREFIX=$prefix" >>"$GITHUB_ENV"

      - name: Check the ari
        run: |
          set -euo pipefail
          ari="$ARI_PREFIX/bin/ari"
          echo "ARI=$ari" >>"$GITHUB_ENV"
          "$ari" info | grep -E 'terminal backend|desktop backend|HTTP'
          # Read whole outputs first: grep -q stops at the first match, and under pipefail the
          # writer's SIGPIPE would fail the step.
          fns=$("$ari" info --functions | tr ' ,' '\n\n')
          grep -qx json-parse <<<"$fns" \
            || { echo "::error::this ari has no json-parse (transfix/libcvc#883)"; exit 1; }
          help=$("$ari" --help 2>&1 || true)
          grep -q 'ari test' <<<"$help" \
            || { echo "::error::this ari has no 'ari test' (transfix/libcvc#896)"; exit 1; }
          printf 'meta: {name: f, min_libcvc: 3.7.4}\nfunctions: (defun f () 1)\ntests: {f: (assert (= (f) 1))}\n' >"$RUNNER_TEMP/f.ari"
          "$ari" test "$RUNNER_TEMP/f.ari" >/dev/null \
            || { echo "::error::this ari has no functions: (transfix/libcvc#900)"; exit 1; }

      # tmux drives the interactive layer. cvcpkg packages it for arm64 only so far, so x86_64
      # runners fall back to apt.
      - name: Install tmux
        run: |
          if ! cvcpkg install tmux --prefix "$RUNNER_TEMP/tmux" --config release --link shared 2>/dev/null; then
            sudo apt-get install -y --no-install-recommends tmux
          else
            echo "$RUNNER_TEMP/tmux/bin" >>"$GITHUB_PATH"
          fi
          tmux -V

      # Layer 3d installs cvcpkg-server into CVCPKG_VENV, and fails here rather than skipping when
      # it can't.
      - name: tests/run.sh
        env:
          TERM: xterm-256color
          CVCPKG_VENV: ${{ runner.temp }}/cvcpkg-venv
          CVCPKG_REQUIRED: "1"
        run: tests/run.sh

  browser:
    name: browser build in headless Chrome
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ari's wasm page is the single-threaded arigl-web package, as a site installs it: its
      # share/arigl-web/ has ari.html, ari.js, ari.wasm, ari-web.* and xterm/. The install also
      # lays down the static wasm libraries the page was linked from (the bundle lists them as its
      # deps), which the site doesn't use.
      - name: Install cvcpkg and arigl-web (cvcpkg)
        run: |
          set -euo pipefail
          curl -fsSL https://cvcpkg.org/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          prefix="$RUNNER_TEMP/arigl-web"
          cvcpkg install arigl-web --platform wasm --arch wasm32 --prefix "$prefix" \
            --config release --link static --no-fallback-to-source
          sed -n '/^- name: arigl-web$/{n;p;}' "$prefix/share/libcvc-deps/lockfile.yaml"
          echo "ARI_WEB=$prefix/share/arigl-web" >>"$GITHUB_ENV"

      - name: Assemble the site
        run: |
          tools/site.sh "$ARI_WEB" site
          du -sh site/apps/cypkg site/apps/cypkg/ari.wasm

      # Node 22 for its built-in WebSocket; the runner image has Chrome.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: tests/browser.mjs
        run: node tests/browser.mjs --site site --chrome "$(command -v google-chrome)" --shots shots

      - name: Upload the failed steps' screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-shots
          path: shots
          if-no-files-found: ignore

      # GitHub Pages: the same page with web/ariadne.config.pages.json, which browses
      # https://cvcpkg.org. Only main's tested build is published (the pages job deploys it): on a
      # push, or on a run started by hand on main, which moves the page to the newest arigl-web
      # release without a commit.
      - name: Assemble the GitHub Pages site
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: tools/site.sh "$ARI_WEB" pages web/ariadne.config.pages.json

      - name: Upload the GitHub Pages site
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/apps/cypkg

  pages:
    name: deploy to GitHub Pages
    needs: browser
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  contract:
    name: contract with cvcpkg.org
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I tests/contract.py

  recipe:
    name: package with the recipe
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install cvcpkg
        run: |
          curl -fsSL https://cvcpkg.org/install.sh | sh
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      - name: cvcpkg build cypkg
        run: |
          set -euo pipefail
          cvcpkg build cypkg --local --platform any --prefix "$RUNNER_TEMP/prefix"
          cd "$RUNNER_TEMP/prefix"
          for f in bin/cypkg bin/cypkg.cmd share/cypkg/main.ari share/cypkg/search.ari \
                   share/cypkg/package.ari share/cypkg/lib.ari share/cypkg/views.ari \
                   share/doc/cypkg/LICENSE; do
            test -f "$f" || { echo "::error::the package has no $f"; exit 1; }
          done
          bin/cypkg --help
