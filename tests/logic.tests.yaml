# The request logic in share/cypkg/main.ari, tested with `ari test` against the fixture registry.
#
# tests/logic.sh appends this file to a copy of main.ari, with the fixture as the server, and runs
# `ari test` on it. Each test drives main.ari's real on_tick the way the views do: it sets state
# and a request flag, waits until search.seq or pkg.seq counts one more finished request, and then
# asserts on the state the views read. Tests run in order, one at a time, after init: and the
# first frame. That first frame starts the search for every build.
#
# Programs can't share a function yet (transfix/libcvc's functions-for-modules work), so each test
# repeats its wait. The fixture's numbers: 196 builds of 10 packages; zstd has 25 builds, 5 of them
# linux.

tests:
  the start-up search lists every build: |
    (begin
      (set i 0)
      (while (if (< (int (state-get "search.seq")) 1) (< i 500) #f) (sleep 0.02) (set i (+ i 1)))
      (assert (= (state-get "search.total") "196") (state-get "search.total"))
      (assert (= (state-get "search.count") "10") (state-get "search.count"))
      (assert (= (state-get "search.status") "builds 1-10 of 196, 10 packages")
              (state-get "search.status")))

  a query narrows the search: |
    (begin
      (set n (int (state-get "search.seq")))
      (state-set "search.q" "zstd")
      (state-set "search.offset" 0)
      (state-set "req.search" "1")
      (set i 0)
      (while (if (<= (int (state-get "search.seq")) n) (< i 500) #f) (sleep 0.02) (set i (+ i 1)))
      (assert (= (state-get "search.total") "25") (state-get "search.total"))
      (assert (= (state-get "search.res.packages.0.name") "zstd"))
      (assert (= (state-get "search.status") "builds 1-10 of 25, 1 package")
              (state-get "search.status")))

  Next pages the search: |
    (begin
      (set n (int (state-get "search.seq")))
      (state-set "search.offset" 10)
      (state-set "req.search" "1")
      (set i 0)
      (while (if (<= (int (state-get "search.seq")) n) (< i 500) #f) (sleep 0.02) (set i (+ i 1)))
      (assert (= (state-get "search.count") "10"))
      (assert (= (state-get "search.status") "builds 11-20 of 25, 1 package")
              (state-get "search.status")))

  the last page is partial: |
    (begin
      (set n (int (state-get "search.seq")))
      (state-set "search.offset" 20)
      (state-set "req.search" "1")
      (set i 0)
      (while (if (<= (int (state-get "search.seq")) n) (< i 500) #f) (sleep 0.02) (set i (+ i 1)))
      (assert (= (state-get "search.count") "5") (state-get "search.count"))
      (assert (= (state-get "search.status") "builds 21-25 of 25, 1 package")))

  a filter change searches again from the first row: |
    (begin
      (set n (int (state-get "search.seq")))
      (state-set "search.platform" "linux")
      (set i 0)
      (while (if (<= (int (state-get "search.seq")) n) (< i 500) #f) (sleep 0.02) (set i (+ i 1)))
      (assert (= (state-get "search.offset") "0") (state-get "search.offset"))
      (assert (= (state-get "search.total") "5") (state-get "search.total"))
      (assert (= (state-get "search.res.packages.0.platform") "linux")))

  the all option sends no filter: |
    (begin
      (set n (int (state-get "search.seq")))
      (state-set "search.platform" "all")
      (set i 0)
      (while (if (<= (int (state-get "search.seq")) n) (< i 500) #f) (sleep 0.02) (set i (+ i 1)))
      (assert (= (state-get "search.total") "25") (state-get "search.total")))

  an HTTP error is a status, not a crash: |
    (begin
      (set n (int (state-get "search.seq")))
      (state-set "search.q" "fault-500")
      (state-set "req.search" "1")
      (set i 0)
      (while (if (<= (int (state-get "search.seq")) n) (< i 500) #f) (sleep 0.02) (set i (+ i 1)))
      (assert (= (state-get "search.count") "0"))
      (assert (= (state-get "search.status") "search failed: HTTP 500") (state-get "search.status")))

  a reply that isn't JSON is a status: |
    (begin
      (set n (int (state-get "search.seq")))
      (state-set "search.q" "fault-badjson")
      (state-set "req.search" "1")
      (set i 0)
      (while (if (<= (int (state-get "search.seq")) n) (< i 500) #f) (sleep 0.02) (set i (+ i 1)))
      (assert (= (state-get "search.count") "0"))
      (assert (= (state-get "search.status")
                 "search failed: the registry's reply was not a search result")))

  a reply of the wrong shape is a status: |
    (begin
      (set n (int (state-get "search.seq")))
      (state-set "search.q" "fault-shape")
      (state-set "req.search" "1")
      (set i 0)
      (while (if (<= (int (state-get "search.seq")) n) (< i 500) #f) (sleep 0.02) (set i (+ i 1)))
      (assert (= (state-get "search.total") "0"))
      (assert (= (state-get "search.status")
                 "search failed: the registry's reply was not a search result")))

  opening a package shows its first builds: |
    (begin
      (set n (int (state-get "pkg.seq")))
      (state-set "pkg.want" "zstd")
      (set i 0)
      (while (if (<= (int (state-get "pkg.seq")) n) (< i 500) #f) (sleep 0.02) (set i (+ i 1)))
      (assert (= (state-get "view") "package"))
      (assert (= (state-get "pkg.name") "zstd"))
      (assert (= (state-get "pkg.total") "25") (state-get "pkg.total"))
      (assert (= (state-get "pkg.count") "10") (state-get "pkg.count"))
      (assert (= (state-get "pkg.install") "cvcpkg install zstd"))
      (assert (= (state-get "pkg.status") "builds 1-10 of 25") (state-get "pkg.status")))

  a build row is formatted for the table: |
    (begin
      (assert (string.contains (state-get "pkg.page.0.where") "/") (state-get "pkg.page.0.where"))
      (assert (string.ends-with (state-get "pkg.page.0.size") " KB") (state-get "pkg.page.0.size"))
      (assert (= (string.length (state-get "pkg.page.0.date")) 10) (state-get "pkg.page.0.date")))

  the last page of builds is partial: |
    (begin
      (set n (int (state-get "pkg.seq")))
      (state-set "pkg.offset" 20)
      (state-set "req.pkgpage" "1")
      (set i 0)
      (while (if (<= (int (state-get "pkg.seq")) n) (< i 500) #f) (sleep 0.02) (set i (+ i 1)))
      (assert (= (state-get "pkg.count") "5") (state-get "pkg.count"))
      (assert (= (state-get "pkg.status") "builds 21-25 of 25")))

  an offset past the end goes back to the first page: |
    (begin
      (set n (int (state-get "pkg.seq")))
      (state-set "pkg.offset" 99)
      (state-set "req.pkgpage" "1")
      (set i 0)
      (while (if (<= (int (state-get "pkg.seq")) n) (< i 500) #f) (sleep 0.02) (set i (+ i 1)))
      (assert (= (state-get "pkg.offset") "0") (state-get "pkg.offset"))
      (assert (= (state-get "pkg.status") "builds 1-10 of 25")))

  null fields become empty text: |
    (begin
      (set n (int (state-get "pkg.seq")))
      (state-set "pkg.want" "edge-nulls")
      (set i 0)
      (while (if (<= (int (state-get "pkg.seq")) n) (< i 500) #f) (sleep 0.02) (set i (+ i 1)))
      (assert (= (state-get "pkg.license") "") (state-get "pkg.license"))
      (assert (= (state-get "pkg.desc") "") (state-get "pkg.desc"))
      (assert (= (state-get "pkg.page.0.size") "") (state-get "pkg.page.0.size"))
      (assert (= (state-get "pkg.page.0.date") "") (state-get "pkg.page.0.date")))

  a long description is cut to the window: |
    (begin
      (set n (int (state-get "pkg.seq")))
      (state-set "pkg.want" "edge-unicode-zoë")
      (set i 0)
      (while (if (<= (int (state-get "pkg.seq")) n) (< i 500) #f) (sleep 0.02) (set i (+ i 1)))
      (assert (= (string.length (state-get "pkg.desc")) 92) (state-get "pkg.desc"))
      (assert (string.ends-with (state-get "pkg.desc") "...")))

  an unknown package says so: |
    (begin
      (set n (int (state-get "pkg.seq")))
      (state-set "pkg.want" "no-such-package")
      (set i 0)
      (while (if (<= (int (state-get "pkg.seq")) n) (< i 500) #f) (sleep 0.02) (set i (+ i 1)))
      (assert (= (state-get "pkg.count") "0"))
      (assert (= (state-get "pkg.status") "no package named no-such-package")
              (state-get "pkg.status")))

  an HTTP error opening a package is a status: |
    (begin
      (set n (int (state-get "pkg.seq")))
      (state-set "pkg.want" "fault-500")
      (set i 0)
      (while (if (<= (int (state-get "pkg.seq")) n) (< i 500) #f) (sleep 0.02) (set i (+ i 1)))
      (assert (= (state-get "pkg.status") "failed: HTTP 500") (state-get "pkg.status")))
